server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # 安全头部
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    # F10: 修正 X-XSS-Protection 值（原含转义引号导致头部值错误）；
    # 收紧 CSP：移除 unsafe-eval，connect-src 仅同源（原 ws:/wss: 允许任意主机外连，
    # 一旦 XSS 即可向任意服务器外传数据；同源 WS 经 nginx /api/ 代理已够用）
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';";
    
    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # P0-1C: 若构建产物含 .gz/.br 预压缩文件，优先直接服务（零 CPU 压缩）
    gzip_static on;
    # brotli_static 需 nginx 编译时开启 brotli 模块，未开启时忽略；开启后自动生效
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # 静态资源缓存
    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control \"public, immutable\";
        add_header Vary \"Accept-Encoding\";
    }
    
    # API代理
    location /api/ {
        proxy_pass http://tshell-server:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection \"upgrade\";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 主应用
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # 防止缓存index.html
        location = /index.html {
            add_header Cache-Control \"no-cache, no-store, must-revalidate\";
            add_header Pragma \"no-cache\";
            add_header Expires \"0\";
        }
    }
    
    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    # 隐藏nginx版本
    server_tokens off;
    
    # 限制请求大小
    client_max_body_size 100M;
    
    # 日志
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}