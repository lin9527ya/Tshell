version: '3.8'

services:
  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: rshell-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-rshell123}
    volumes:
      - redis_data:/data
    networks:
      - rshell-network
    healthcheck:
      test: [\"CMD\", \"redis-cli\", \"--raw\", \"incr\", \"ping\"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Rshell服务端
  rshell-server:
    build:
      context: ./Rshell---A-Cross-Platform-C2
      dockerfile: Dockerfile
    container_name: rshell-server
    restart: unless-stopped
    ports:
      - \"${SERVER_PORT:-8089}:8089\"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-rshell123}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - ENV=${ENV:-production}
    volumes:
      - server_data:/app/data
      - server_logs:/app/logs
      - server_config:/app/config
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rshell-network
    healthcheck:
      test: [\"CMD\", \"wget\", \"--no-verbose\", \"--tries=1\", \"--spider\", \"http://localhost:8089/api/dashboard/stats\"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # Rshell Web前端
  rshell-web:
    build:
      context: ./Rshell-web
      dockerfile: Dockerfile
    container_name: rshell-web
    restart: unless-stopped
    ports:
      - \"${WEB_PORT:-80}:80\"
    depends_on:
      rshell-server:
        condition: service_healthy
    networks:
      - rshell-network
    healthcheck:
      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost/\"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /var/run
      - /var/cache/nginx

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: rshell-prometheus
    restart: unless-stopped
    ports:
      - \"${PROMETHEUS_PORT:-9090}:9090\"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - rshell-network
    profiles:
      - monitoring

  # Grafana可视化
  grafana:
    image: grafana/grafana:latest
    container_name: rshell-grafana
    restart: unless-stopped
    ports:
      - \"${GRAFANA_PORT:-3000}:3000\"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - rshell-network
    profiles:
      - monitoring

  # Nginx负载均衡器（用于多实例部署）
  nginx-lb:
    image: nginx:1.25-alpine
    container_name: rshell-nginx-lb
    restart: unless-stopped
    ports:
      - \"${LB_PORT:-443}:443\"
      - \"${LB_HTTP_PORT:-8080}:80\"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - rshell-web
    networks:
      - rshell-network
    profiles:
      - production

networks:
  rshell-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.enable_icc: \"true\"
      com.docker.network.bridge.enable_ip_masquerade: \"true\"

volumes:
  redis_data:
    driver: local
  server_data:
    driver: local
  server_logs:
    driver: local
  server_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 环境变量说明：
# SERVER_PORT: 服务端端口 (默认: 8089)
# WEB_PORT: Web前端端口 (默认: 80)
# REDIS_PASSWORD: Redis密码 (默认: rshell123)
# JWT_SECRET: JWT密钥 (必须设置)
# ENV: 环境 (development/production)
# PROMETHEUS_PORT: Prometheus端口 (默认: 9090)
# GRAFANA_PORT: Grafana端口 (默认: 3000)
# GRAFANA_USER: Grafana用户名 (默认: admin)
# GRAFANA_PASSWORD: Grafana密码 (默认: admin123)
# LB_PORT: 负载均衡器HTTPS端口 (默认: 443)
# LB_HTTP_PORT: 负载均衡器HTTP端口 (默认: 8080)