apiVersion: v1
kind: Namespace
metadata:
  name: rshell
  labels:
    name: rshell
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rshell-config
  namespace: rshell
data:
  config.yaml: |
    server:
      host: \"0.0.0.0\"
      port: 8089
      mode: \"release\"
      read_timeout: \"30s\"
      write_timeout: \"30s\"
      idle_timeout: \"60s\"
    
    database:
      type: \"sqlite3\"
      path: \"/data/database.db\"
      max_open_conns: 25
      max_idle_conns: 5
      max_lifetime: \"5m\"
    
    jwt:
      secret_key_file: \"/data/jwt_key.hex\"
      access_token_ttl: \"15m\"
      refresh_token_ttl: \"168h\"
      max_refresh_count: 100
      algorithm: \"HS256\"
    
    logging:
      level: \"info\"
      format: \"json\"
      output: \"stdout\"
      audit_log_dir: \"/data/logs\"
      max_file_size: 104857600
      max_retain_days: 30
      enable_console: true
    
    security:
      enable_rate_limit: true
      login_rate_limit: 5
      api_rate_limit: 100
      block_duration: \"15m\"
      sliding_window: \"1m\"
      max_login_attempts: 5
      enable_ip_whitelist: false
      whitelist_ips: []
---
apiVersion: v1
kind: Secret
metadata:
  name: rshell-secrets
  namespace: rshell
type: Opaque
data:
  jwt-secret: eW91ci1qd3Qtc2VjcmV0LWtleQ==  # base64 encoded \"your-jwt-secret-key\"
  redis-password: cnNoZWxsMTIz  # base64 encoded \"rshell123\"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rshell-data-pvc
  namespace: rshell
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rshell-server
  namespace: rshell
  labels:
    app: rshell-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: rshell-server
  template:
    metadata:
      labels:
        app: rshell-server
      annotations:
        prometheus.io/scrape: \"true\"
        prometheus.io/port: \"8089\"
        prometheus.io/path: \"/metrics\"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: rshell-server
        image: rshell/server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8089
          name: http
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: rshell-secrets
              key: jwt-secret
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rshell-secrets
              key: redis-password
        - name: REDIS_URL
          value: \"redis://redis-service:6379\"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: data-volume
          mountPath: /data
        resources:
          limits:
            memory: \"1Gi\"
            cpu: \"1000m\"
          requests:
            memory: \"512Mi\"
            cpu: \"500m\"
        livenessProbe:
          httpGet:
            path: /api/dashboard/stats
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/dashboard/stats
            port: 8089
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: rshell-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: rshell-data-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: rshell-server-service
  namespace: rshell
  labels:
    app: rshell-server
spec:
  type: ClusterIP
  ports:
  - port: 8089
    targetPort: 8089
    protocol: TCP
    name: http
  selector:
    app: rshell-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rshell-web
  namespace: rshell
  labels:
    app: rshell-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: rshell-web
  template:
    metadata:
      labels:
        app: rshell-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: rshell-web
        image: rshell/web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            memory: \"256Mi\"
            cpu: \"500m\"
          requests:
            memory: \"128Mi\"
            cpu: \"250m\"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: rshell-web-service
  namespace: rshell
  labels:
    app: rshell-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: rshell-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rshell
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rshell-secrets
              key: redis-password
        command:
        - redis-server
        - --appendonly
        - \"yes\"
        - --requirepass
        - $(REDIS_PASSWORD)
        resources:
          limits:
            memory: \"256Mi\"
            cpu: \"500m\"
          requests:
            memory: \"128Mi\"
            cpu: \"250m\"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --raw
            - incr
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --raw
            - incr
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: rshell
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rshell-ingress
  namespace: rshell
  annotations:
    kubernetes.io/ingress.class: \"nginx\"
    nginx.ingress.kubernetes.io/ssl-redirect: \"true\"
    nginx.ingress.kubernetes.io/proxy-body-size: \"100m\"
    cert-manager.io/cluster-issuer: \"letsencrypt-prod\"
spec:
  tls:
  - hosts:
    - rshell.yourdomain.com
    secretName: rshell-tls
  rules:
  - host: rshell.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: rshell-server-service
            port:
              number: 8089
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rshell-web-service
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rshell-server-pdb
  namespace: rshell
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rshell-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rshell-web-pdb
  namespace: rshell
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rshell-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rshell-server-hpa
  namespace: rshell
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rshell-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rshell-web-hpa
  namespace: rshell
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rshell-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70