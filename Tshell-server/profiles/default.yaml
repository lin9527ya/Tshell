# ============================================================
# Tshell Malleable C2 Profile（仿 CS profile 概念，YAML 格式）
# ------------------------------------------------------------
# 所有流量特征项在此集中配置，生成客户端时自动写入；
# 修改后保存经 API 立即生效(前端"保存画像"→ 即时 Reload)；直接编辑本文件需重启服务端。
# 变更仅影响新生成的客户端与新建监听器。
# 注意：所有路径必须为合法 URL 路径（以 / 开头）。
# ============================================================

# 画像名称（用于监听器/生成器选择；缺省用文件名）
name: default

# 画像说明（仅作备注）
description: "默认画像：保留腾讯系接口伪装路径"

# ------------------------------------------------------------
# 网络请求 User-Agent
# 消除 Go-http-client/1.1 特征；建议按目标环境伪装浏览器
# ------------------------------------------------------------
useragent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 心跳基准（毫秒）：客户端空闲轮询/心跳间隔基准，1-60000 钳制。
# 调大更隐蔽（连接频率低）但命令响应变慢
sleeptime_ms: 1000

# ------------------------------------------------------------
# HTTP 传输伪装（http-get / http-post）
# uri: 请求路径（服务端监听器按此注册；默认保留腾讯系接口伪装）
# ------------------------------------------------------------
http:
  get:
    uri: "/tencent/mcp/pc/pcsearch"
    # metadata_channel: metadata 传输通道——cookie/header/url/auto（auto=每请求随机切换，
    # 破除"固定放 Cookie"的静态特征；服务端三通道统一提取）
    metadata_channel: auto
    # padding: 流量填充——请求随机附加头 + 响应 JSON 随机 pad 字段，破除长度指纹
    padding: true
  post:
    uri: "/tencent/sensearch/collection/item/check"

# ------------------------------------------------------------
# WebSocket 传输路径（可任意定制以混淆 /ws 特征）
# ------------------------------------------------------------
ws:
  path: "/ws"

# ------------------------------------------------------------
# TLS 指纹（JA3）：对齐主流浏览器的 ClientHello。
# 可选值: chrome_120 / firefox_121 / edge_120 / safari_17
# 留空使用系统默认（Go 原生指纹，特征明显，不建议）
# ------------------------------------------------------------
tls:
  ja3: "chrome_120"

# ------------------------------------------------------------
# DNS 传输特征
# beacon_prefix: 上线/轮询查询的子域前缀
# ------------------------------------------------------------
dns:
  beacon_prefix: "update"
