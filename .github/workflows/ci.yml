name: CI

on:
  push:
    # vshell-ui 是当前开发分支；只写 main/master 会让 CI 在活跃分支上从不触发
    branches: [main, master, vshell-ui]
  pull_request:
    branches: [main, master, vshell-ui]

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tshell-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 跟随 go.mod，避免版本 pin 漂移（原固定 1.21，而 go.mod 要求 1.24）
          go-version-file: Tshell-server/go.mod
          cache: true
      - name: Prepare client templates (only if missing)
        # 模板已随仓库提供（Tshell-server/pkg/api/server/，206 个文件），正常情况下这里
        # 直接跳过。若因故缺失（例如有人把该目录重新加回 .gitignore），就地构建
        # linux/amd64 子集兜底 —— 否则 `//go:embed server/*` 会让构建步直接失败，
        # 后面的 vet/staticcheck/单测/覆盖率全都跑不到（历史上 server 与 reproducible
        # 两个 job 就是这样长期恒红）。
        working-directory: Tshell-client/implant
        env:
          TSHELL_TEMPLATE_ARCHES: "linux amd64"
          TSHELL_SKIP_DLL: "1"
        run: |
          if [ -n "$(ls -A ../Tshell-server/pkg/api/server 2>/dev/null)" ]; then
            echo "模板已随仓库提供，跳过构建"
          else
            echo "模板缺失，构建 linux/amd64 子集兜底"
            bash build_templates.sh
          fi
      - name: Build (version injected)
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          go build -ldflags "-X main.Version=$VERSION -X main.GitCommit=$COMMIT" ./...
      - name: Build (file mode, as build.sh does)
        # build.sh 用文件模式 `go build ./main.go`（Windows+TDM-GCC 下验证过的唯一可用形态）。
        # 包模式 `go build ./...` 对"main 包里多出第二个 .go"是绿的，只有文件模式会炸，
        # 因此这里单独守一道。
        run: go build -o /dev/null ./main.go
      - name: Vet
        # 含根目录 package main（route_policy_test 所在包）
        run: go vet ./...
      - name: Staticcheck
        # 只跑缺陷类检查：ST*（命名/注释风格，遗留代码 500+ 条）与 U1000（未使用符号，
        # 多为刻意保留的公共 API）不计入门禁；SA/S/QF 全开。
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks=all,-ST*,-U1000 ./...
      - name: Test (race + coverage)
        # 必须跑 ./... 而非 ./pkg/...：根目录的安全策略断言（RBAC/WS 握手/请求体上限）在 package main
        run: go test -race ./... -count=1 -coverprofile=coverage.out
      - name: Coverage gate (>= 20%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 20) }' || { echo "::error::覆盖率 ${total}% 低于阈值 20%"; exit 1; }

  reproducible:
    name: Reproducible Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tshell-client/implant/go.mod
          cache: true
      - name: Install C toolchain (server needs cgo for SQLite)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc
      - name: Prepare client templates (only if missing)
        # 模板已随仓库提供（Tshell-server/pkg/api/server/，206 个文件），正常情况下这里
        # 直接跳过。若因故缺失（例如有人把该目录重新加回 .gitignore），就地构建
        # linux/amd64 子集兜底 —— 否则 `//go:embed server/*` 会让构建步直接失败，
        # 后面的 vet/staticcheck/单测/覆盖率全都跑不到（历史上 server 与 reproducible
        # 两个 job 就是这样长期恒红）。
        working-directory: Tshell-client/implant
        env:
          TSHELL_TEMPLATE_ARCHES: "linux amd64"
          TSHELL_SKIP_DLL: "1"
        run: |
          if [ -n "$(ls -A ../Tshell-server/pkg/api/server 2>/dev/null)" ]; then
            echo "模板已随仓库提供，跳过构建"
          else
            echo "模板缺失，构建 linux/amd64 子集兜底"
            bash build_templates.sh
          fi
      - name: Build twice and compare
        # 同一源码 + 同一工具链 + 同一参数必须产出逐字节相同的二进制。
        # 构建时间取提交时间（SOURCE_DATE_EPOCH），不用"现在"。
        run: ./scripts/repro-build.sh --check --out "$RUNNER_TEMP/repro"
      - name: Upload manifest and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest
          path: |
            ${{ runner.temp }}/repro/build-manifest.json
            ${{ runner.temp }}/repro/sbom-*.json

  implant:
    name: Implant (Go, 12 transports)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tshell-client/implant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tshell-client/implant/go.mod
          cache: true
      - name: Build all transports
        run: |
          for t in tcp kcp http https oss websocket dns \
                   tcp_forward kcp_forward ws_forward http_forward https_forward multi; do
            go build -tags transport_$t -o /dev/null ./cmd/single || exit 1
          done
      - name: Test multi-transport scheduler
        # 多传输调度器的用例带 transport_multi 构建标签，默认 go test 不会执行
        run: go test -tags transport_multi ./cmd/single/ -count=1
      - name: Test (race)
        # ./... 含 cmd/single 的传输接线守卫（pollTransport 必须实现 PollInterval）
        run: go test -race ./... -count=1
      - name: Staticcheck
        # 只跑缺陷类检查：ST*（命名/注释风格，遗留代码 500+ 条）与 U1000（未使用符号，
        # 多为刻意保留的公共 API）不计入门禁；SA/S/QF 全开。
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks=all,-ST*,-U1000 ./...

  postgres:
    name: PostgreSQL Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tshell-server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tshell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tshell-server/go.mod
          cache: true
      - name: PostgreSQL integration test
        # 覆盖建表/版本化迁移/xorm CRUD/原生 SQL 占位符/序列重置/列内省
        env:
          TSHELL_TEST_PG_DSN: "host=127.0.0.1 port=5432 user=postgres password=test dbname=tshell sslmode=disable"
        run: go test ./pkg/database/ -run TestPostgresBackend -v -count=1

  relay:
    name: Relay (Go, stdlib only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tshell-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Tshell-relay/go.mod
          cache: true
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o /dev/null .
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        # 只跑缺陷类检查：ST*（命名/注释风格，遗留代码 500+ 条）与 U1000（未使用符号，
        # 多为刻意保留的公共 API）不计入门禁；SA/S/QF 全开。
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 -checks=all,-ST*,-U1000 ./...
      - name: Test (race)
        # 覆盖双向转发、两级级联、连接/空闲上限、TLS 终止、UDP 流表、健康检查
        run: go test -race ./... -count=1

  web:
    name: Web (Vue3 + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tshell-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tshell-web/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
